spring:
  application:
    name: tcp-gateway

server:
  port: 8080

tcp-gateway:
  # Maximum time to wait for a correlated response before returning 504.
  response-timeout-ms: 30000

  # One entry per PPG (pool name must match the {ppg} path variable).
  #
  # Direction is named from the perspective of who initiates the payment request:
  #   *_IN  — this service sends a payment request to the bank (existing dispatch flow).
  #   *_OUT — the bank sends a payment request to this service, which auto-replies.
  # OTH_IN/OTH_OUT are the catch-all for the less common payment types (bulk auth,
  # forward-dated, return, scheme return, corporate bulk). USM_IN carries network
  # management (9804/9814) and admin advice (9624) traffic — inbound-only.
  pools:
    SIP_IN:
      host: localhost
      port: 9001
      pool-size: 5
    SOP_IN:
      host: localhost
      port: 9002
      pool-size: 3
    OTH_IN:
      host: localhost
      port: 9003
      pool-size: 2
    USM_IN:
      host: localhost
      port: 9004
      pool-size: 1
    SIP_OUT:
      host: localhost
      port: 9011
      pool-size: 5
    SOP_OUT:
      host: localhost
      port: 9012
      pool-size: 3
    OTH_OUT:
      host: localhost
      port: 9013
      pool-size: 2

logging:
  level:
    com.jackbourner.tcpgateway: DEBUG
